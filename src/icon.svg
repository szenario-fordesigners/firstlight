<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Rounded Tile Background -->
  <rect width="120" height="120" rx="26" fill="#FFC899"/>

  <!-- Tripod Base & Legs -->
  <g stroke="#8A3B12" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="58" y1="68" x2="43" y2="98"/>
    <line x1="58" y1="68" x2="58" y2="100"/>
    <line x1="58" y1="68" x2="73" y2="98"/>
  </g>
  <!-- Tripod Mount Hub -->
  <circle cx="58" cy="67" r="5.5" fill="#8A3B12"/>

  <!-- Telescope Assembly (Rotated -28 deg around pivot 58,58) -->
  <g transform="rotate(-28 58 58)" fill="#8A3B12">
    <!-- Eyepiece Flange -->
    <rect x="14" y="50" width="6.5" height="16" rx="3.25"/>
    <!-- Eyepiece Neck -->
    <rect x="23.5" y="53" width="9" height="10" rx="2"/>
    
    <!-- Finderscope Bracket & Tube -->
    <rect x="39" y="40" width="5.5" height="9"/>
    <rect x="32" y="36.5" width="20" height="5.5" rx="2.75"/>

    <!-- Rear Barrel (with subtle curved notch at bottom-right for tripod mount) -->
    <path d="M 35 47 H 56 A 2 2 0 0 1 58 49 V 61 A 8 8 0 0 0 51 69 H 35 A 3 3 0 0 1 32 66 V 50 A 3 3 0 0 1 35 47 Z"/>

    <!-- Main Optical Tube -->
    <rect x="61.5" y="45" width="22" height="26" rx="3"/>

    <!-- Front Objective Hood -->
    <rect x="87" y="43" width="10.5" height="30" rx="4"/>

    <!-- First Light Photon / Star -->
    <circle cx="107.5" cy="58" r="4.8"/>
  </g>
</svg>
